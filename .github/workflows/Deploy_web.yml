name: Deploy Flutter Web

on:
  push:
    branches: [ main ]   # or whatever your main branch is

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
            #flutter-version: '3.24.2'   # or omit to use latest stable
            channel: 'stable'
            cache: true # choose your version

      - name: Install dependencies
        working-directory: ./packages/whiteshorts_crowd_app
        run: flutter pub get

      - name: Build Flutter Web
        working-directory: ./packages/whiteshorts_crowd_app
        run: flutter build web --release --base-href "/elfie-in-white-shorts/"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: packages/whiteshorts_crowd_app/build/web
